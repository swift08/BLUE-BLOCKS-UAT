name: Deploy to blueblocks.in

on:
  push:
    branches:
      - live

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - name: Deploy to cPanel (live)
        uses: samkirkland/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_LIVE_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: out/
          server-dir: public_html/blueblocks.in/
          dangerous-clean-slate: true