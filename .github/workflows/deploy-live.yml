name: Deploy to blueblocks.in (LIVE)

on:
  push:
    branches:
      - live

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Assumes next.config.js uses output: "export" so /out is generated by build
      - name: Build Next.js (Static Export)
        run: npm run build

      - name: Deploy to cPanel via FTP (LIVE)
        uses: samkirkland/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_LIVE_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: out/
          server-dir: /public_html/blueblocks.in/
          dangerous-clean-slate: true