name: Deploy to blueblocks.in (LIVE)

on:
  push:
    branches:
      - live

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Next.js (Static Export)
        run: npm run build

      # ✅ Debug: confirm out/ exists and contains index.html
      - name: Verify export output
        run: |
          echo "PWD: $(pwd)"
          ls -la
          ls -la out || true
          find out -maxdepth 2 -name "index.html" -print || true

      # ✅ Debug: create a marker file so you can locate where it lands on cPanel
      - name: Create marker file
        run: |
          echo "DEPLOY MARKER $(date)" > out/DEPLOY_MARKER.txt
          ls -la out | head

      - name: Deploy to cPanel via FTP (LIVE)
        uses: samkirkland/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_LIVE_FTP_SERVER }}
          username: ${{ secrets.CPANEL_LIVE_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_LIVE_FTP_PASSWORD }}
          local-dir: out/
          server-dir: ./