name: Deploy Docker via SSH

on:
  push:
    branches:
      - live
  workflow_dispatch:
  repository_dispatch:
    types:
      - wordpress_content_changed

jobs:
  deploy-ssh-docker:
    name: Deploy via SSH Docker
    runs-on: ubuntu-latest

    steps:
      - name: SSH into Server and Deploy Docker Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_SSH_PORT || '22' }}
          command_timeout: 30m
          script_stop: true
          script: |
            cd ${{ secrets.SERVER_PATH }}
            git config remote.origin.url https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/nsbweb/blueblocks.git
            git fetch origin live
            git reset --hard origin/live
            docker compose up -d --build
            docker image prune -f

