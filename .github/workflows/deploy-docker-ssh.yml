name: Deploy Docker via SSH

on:
  push:
    branches:
      - live
  workflow_dispatch:
  repository_dispatch:
    types:
      - wordpress_content_changed

jobs:
  deploy-ssh-docker:
    name: Deploy via SSH Docker
    runs-on: ubuntu-latest

    steps:
      - name: SSH into Server and Deploy Docker Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_SSH_PORT || '22' }}
          command_timeout: 30m
          script_stop: true
          script: |
            cd ${{ secrets.SERVER_PATH }}
            git config remote.origin.url https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/nsbweb/blueblocks.git
            git fetch origin live
            git reset --hard origin/live
            # Catalogue videos are stored in Git LFS — pull real MP4s before Docker build
            if ! command -v git-lfs >/dev/null 2>&1; then
              curl -fsSL https://github.com/git-lfs/git-lfs/releases/download/v3.5.1/git-lfs-linux-amd64-v3.5.1.tar.gz -o /tmp/git-lfs.tgz
              tar -xzf /tmp/git-lfs.tgz -C /tmp
              sudo /tmp/git-lfs-3.5.1/install.sh || /tmp/git-lfs-3.5.1/install.sh
            fi
            git lfs install --local
            git lfs pull origin live
            docker compose up -d --build
            docker image prune -f

