server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Prevent Nginx from appending internal container port (8080) to redirects
    port_in_redirect off;
    absolute_redirect off;

    location ^~ /wp-json/ {
        proxy_pass https://wp.blueblocks.in/wp-json/;
        proxy_set_header Host wp.blueblocks.in;
        proxy_ssl_server_name on;
        add_header Cache-Control "no-store";
    }

    location ^~ /blog/ {
        try_files $uri $uri/ $uri/index.html /blog/index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
