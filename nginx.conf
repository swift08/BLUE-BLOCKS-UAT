server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Prevent Nginx from appending internal container port (8080) to redirects
    port_in_redirect off;
    absolute_redirect off;

    location /api/preview {
        if ($arg_slug != "") {
            return 302 /blog/$arg_slug/?preview_id=$arg_id&preview=true;
        }
        return 302 /blog/?preview_id=$arg_id&preview=true;
    }

    location ^~ /blog/ {
        try_files $uri $uri/ $uri/index.html /blog/index.html =404;
    }

    # Permanent redirects. Static export does not emit Next.js redirects.
    location = /ami-training { return 301 /ami-montessori-training/; }
    location = /ami-training/ { return 301 /ami-montessori-training/; }
    location = /video-catalogue { return 301 /video-catalog/; }
    location = /video-catalogue/ { return 301 /video-catalog/; }
    location = /videos { return 301 /video-catalog/; }
    location = /videos/ { return 301 /video-catalog/; }
    location = /annoucement-centre { return 301 /announcement-centre/; }
    location = /annoucement-centre/ { return 301 /announcement-centre/; }
    location = /parents { return 301 /announcement-centre/; }
    location ~ ^/parents/ { return 301 /announcement-centre/; }
    location = /papers { return 301 /research-institute/; }
    location ~ ^/papers/ { return 301 /research-institute/; }
    location = /publications { return 301 /research-institute/; }
    location ~ ^/publications/ { return 301 /research-institute/; }
    location = /innovation/cubesat-mission { return 301 /achievements/; }
    location = /innovation/cubesat-mission/ { return 301 /achievements/; }
    location ~ ^/team/([A-Za-z0-9_-]+)/?$ { return 301 /about-us/?guide=$1; }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
