server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Prevent Nginx from appending internal container port (8080) to redirects
    port_in_redirect off;
    absolute_redirect off;

    location /api/preview {
        if ($arg_slug != "") {
            return 302 /blog/$arg_slug/?preview_id=$arg_id&preview=true;
        }
        return 302 /blog/?preview_id=$arg_id&preview=true;
    }

    location ^~ /blog/wp-admin {
        proxy_pass https://wp.blueblocks.in/wp-admin;
        proxy_set_header Host wp.blueblocks.in;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;
        proxy_redirect https://wp.blueblocks.in/wp-admin/ /blog/wp-admin/;
        proxy_redirect https://wp.blueblocks.in/wp-admin /blog/wp-admin;
        proxy_redirect https://wp.blueblocks.in/wp-login.php /blog/wp-login.php;
        proxy_redirect https://wp.blueblocks.in/ /blog/;
        proxy_cookie_domain wp.blueblocks.in blueblocks.in;
        sub_filter 'wp.blueblocks.in' 'blueblocks.in/blog';
        sub_filter 'https%3A%2F%2Fwp.blueblocks.in' 'https%3A%2F%2Fblueblocks.in%2Fblog';
        sub_filter_once off;
    }

    location ^~ /blog/wp-login.php {
        proxy_pass https://wp.blueblocks.in/wp-login.php;
        proxy_set_header Host wp.blueblocks.in;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;
        proxy_redirect https://wp.blueblocks.in/wp-admin/ /blog/wp-admin/;
        proxy_redirect https://wp.blueblocks.in/wp-login.php /blog/wp-login.php;
        proxy_redirect https://wp.blueblocks.in/ /blog/;
        proxy_cookie_domain wp.blueblocks.in blueblocks.in;
        sub_filter 'wp.blueblocks.in' 'blueblocks.in/blog';
        sub_filter 'https%3A%2F%2Fwp.blueblocks.in' 'https%3A%2F%2Fblueblocks.in%2Fblog';
        sub_filter_once off;
    }

    location ^~ /wp-admin/ {
        proxy_pass https://wp.blueblocks.in/wp-admin/;
        proxy_set_header Host wp.blueblocks.in;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;
        proxy_redirect https://wp.blueblocks.in/wp-admin/ /wp-admin/;
        proxy_redirect https://wp.blueblocks.in/wp-login.php /wp-login.php;
        proxy_redirect https://wp.blueblocks.in/ /;
        proxy_cookie_domain wp.blueblocks.in blueblocks.in;
        sub_filter 'wp.blueblocks.in' 'blueblocks.in/blog';
        sub_filter 'https%3A%2F%2Fwp.blueblocks.in' 'https%3A%2F%2Fblueblocks.in%2Fblog';
        sub_filter_once off;
    }

    location ^~ /wp-login.php {
        proxy_pass https://wp.blueblocks.in/wp-login.php;
        proxy_set_header Host wp.blueblocks.in;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;
        proxy_redirect https://wp.blueblocks.in/wp-admin/ /wp-admin/;
        proxy_redirect https://wp.blueblocks.in/wp-login.php /wp-login.php;
        proxy_redirect https://wp.blueblocks.in/ /;
        proxy_cookie_domain wp.blueblocks.in blueblocks.in;
        sub_filter 'wp.blueblocks.in' 'blueblocks.in/blog';
        sub_filter 'https%3A%2F%2Fwp.blueblocks.in' 'https%3A%2F%2Fblueblocks.in%2Fblog';
        sub_filter_once off;
    }

    location ^~ /wp-includes/ {
        proxy_pass https://wp.blueblocks.in/wp-includes/;
        proxy_set_header Host wp.blueblocks.in;
        proxy_ssl_server_name on;
    }

    location ^~ /wp-content/ {
        proxy_pass https://wp.blueblocks.in/wp-content/;
        proxy_set_header Host wp.blueblocks.in;
        proxy_ssl_server_name on;
    }

    location ^~ /wp-json/ {
        proxy_pass https://wp.blueblocks.in/wp-json/;
        proxy_set_header Host wp.blueblocks.in;
        proxy_ssl_server_name on;
        add_header Cache-Control "no-store";
    }

    location ^~ /blog/ {
        try_files $uri $uri/ $uri/index.html /blog/index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
